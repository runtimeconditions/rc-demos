name: Portable Profile demo

on:
  pull_request:
    paths:
      - ".github/workflows/portable-profile.yaml"
      - "apps/request-logger-http/**"
      - "apps/request-logger-http-java/**"
      - "apps/request-logger-http-python/**"
      - "apps/todos-api/**"
      - "artifacts/**"
      - "portable-profile/**"
      - "kratix/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/portable-profile.yaml"
      - "apps/request-logger-http/**"
      - "apps/request-logger-http-java/**"
      - "apps/request-logger-http-python/**"
      - "apps/todos-api/**"
      - "artifacts/**"
      - "portable-profile/**"
      - "kratix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-profile:
    name: Generate once, consume twice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: rc-demos
      - uses: actions/setup-go@v7
        with:
          go-version-file: rc-demos/apps/request-logger-http/go.mod
          cache-dependency-path: |
            rc-demos/apps/request-logger-http/go.sum
            rc-demos/portable-profile/go.sum
      - name: Install the rc CLI
        run: |
          curl -fsSL https://runtimeconditions.io/packages/setup.sh | sudo sh
          sudo apt-get install -y rc-cli
      - name: Committed Profile matches application source
        working-directory: rc-demos
        run: portable-profile/scripts/generate-profile.sh --check
      - name: Development consumer tests
        working-directory: rc-demos/portable-profile
        run: go test ./...
      - name: Kratix resolver tests
        working-directory: rc-demos/kratix/promises/application-release/pipeline
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet PyYAML==6.0.2
          "$RUNNER_TEMP/venv/bin/python" -m unittest -v test_resolver
      - name: Development demo reaches both dependencies
        working-directory: rc-demos
        run: portable-profile/scripts/run-dev.sh

  java-python-builds:
    name: Java and Python builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: apps/request-logger-http-java/pom.xml
      - name: Java app builds against the published bindings
        working-directory: apps/request-logger-http-java
        run: mvn -q -B package
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python app installs from the published bindings
        working-directory: apps/request-logger-http-python
        run: |
          python -m venv "$RUNNER_TEMP/pyvenv"
          "$RUNNER_TEMP/pyvenv/bin/pip" install --quiet .
          "$RUNNER_TEMP/pyvenv/bin/python" -c "import request_logger_http.app, runtimeconditions_common_integrations, runtimeconditions_env_configuration"
