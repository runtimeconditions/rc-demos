[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "request-logger-http-python"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "runtimeconditions-common-integrations==0.2.0",
  "runtimeconditions-env-configuration==0.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
